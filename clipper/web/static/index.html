<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GTA VI Clipper</title>
<link rel="icon" href="/favicon.png">
<style>
  /* ---------- Tokens: "Vice night" (dark) and "Vice day" (light), following the Windows setting ----------
     All text pairs measured: text ≥ 16:1, secondary text ≥ 6:1, accent/teal/red ≥ 4.8:1 in both modes. */
  :root {
    --bg: #f6f3f7; --surface: #ffffff; --surface-2: #f4f1f6; --line: #e4dfe8;
    --text: #17141d; --text-2: #5f586b;
    --accent: #d4246f; --on-accent: #ffffff; --accent-soft: rgba(212, 36, 111, .10);
    --done: #0b8077; --danger: #c92a3a; --danger-soft: rgba(201, 42, 58, .08);
    --sunset: linear-gradient(90deg, #d4246f, #e8743a 62%, #f0a63c);
    --shadow: 0 1px 2px rgba(23, 20, 29, .06), 0 4px 16px rgba(23, 20, 29, .05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0b12; --surface: #15131d; --surface-2: #1d1a27; --line: #2b2736;
      --text: #f3f0f7; --text-2: #a69fb5;
      --accent: #ff5aa5; --on-accent: #1b0a14; --accent-soft: rgba(255, 90, 165, .12);
      --done: #34d6c4; --danger: #ff6b6b; --danger-soft: rgba(255, 107, 107, .10);
      --sunset: linear-gradient(90deg, #ff5aa5, #ff9a5a 62%, #ffc76b);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  /* Type: SF Pro on Apple devices (the system font there). Everywhere else, Inter: an open-licensed
     typeface in the same spirit, bundled with the app (SF Pro's licence doesn't allow bundling it). */
  @font-face { font-family: "Inter"; src: url("/fonts/InterVariable.woff2") format("woff2");
               font-weight: 100 900; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", "Segoe UI", sans-serif;
         font-optical-sizing: auto;   /* Inter adjusts its letter shapes for small and large sizes, like SF */
         -webkit-font-smoothing: antialiased; }
  input, textarea, select, button { font-family: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Layout: sidebar (navigation) + content ---------- */
  .app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px;
             display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .content { overflow: auto; padding: 28px 36px 48px; }
  .content-inner { max-width: 1080px; margin: 0 auto; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .content { padding: 20px 16px 40px; overflow: visible; }
  }

  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  .brand span { font-weight: 600; font-size: 15px; flex: 1; }
  .icon-btn { background: none; border: 0; color: var(--text-2); width: 32px; height: 32px; border-radius: 8px;
              display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover, .icon-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
  .side-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 4px 8px 0; }

  .jobs { display: flex; flex-direction: column; gap: 2px; }
  .job { all: unset; box-sizing: border-box; display: block; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
  .job:hover { background: var(--surface-2); }
  .job[aria-current="true"] { background: var(--accent-soft); }
  .job .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job[aria-current="true"] .t { color: var(--accent); }
  .job .s { font-size: 12.5px; color: var(--text-2); display: flex; gap: 6px; align-items: center; margin-top: 1px; }
  .job:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-2); }
  .dot.done { background: var(--done); }
  .dot.error { background: var(--danger); border-radius: 1px; transform: rotate(45deg); }   /* shape differs too */
  .dot.running { background: transparent; border: 2px solid var(--text-2); }
  .side-empty { font-size: 13px; color: var(--text-2); padding: 4px 8px; }

  /* ---------- Buttons and inputs ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 9px;
         padding: 8px 14px; min-height: 34px; font: inherit; font-weight: 600; cursor: pointer;
         border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.quiet { background: none; border-color: transparent; color: var(--text-2); font-weight: 500; }
  .btn.quiet:hover { background: var(--surface-2); color: var(--text); }
  .btn.danger { color: var(--danger); }
  .btn.danger.armed { background: var(--danger); border-color: transparent; color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
  .btn.small { padding: 5px 11px; min-height: 30px; font-size: 13px; }
  .btn.block { width: 100%; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
  input:not([type=checkbox]), textarea, .select {
    width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 9px 11px; font: inherit; }
  input::placeholder, textarea::placeholder { color: var(--text-2); opacity: .8; }
  input:focus, textarea:focus, .select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 68px; }
  .select.inline { width: auto; }
  .hint { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }

  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--text-2); padding: 6px 14px; border-radius: 7px;
                cursor: pointer; font: inherit; font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .seg.full { display: flex; } .seg.full button { flex: 1; }

  /* ---------- Page headings ---------- */
  h1 { font-size: 22px; line-height: 1.3; font-weight: 650; margin: 0; letter-spacing: -.2px; }
  h2 { font-size: 15px; font-weight: 650; margin: 0 0 12px; }
  .lede { color: var(--text-2); margin: 6px 0 0; max-width: 60ch; }
  .meta { color: var(--text-2); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
  .meta a { text-decoration-color: var(--line); text-underline-offset: 3px; }
  .section { margin-top: 32px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }

  /* ---------- New video ---------- */
  .new { max-width: 560px; }
  .new form { margin-top: 22px; }
  .new .btn.primary { margin-top: 24px; min-height: 40px; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 1em; }
  .msg.err { color: var(--danger); }

  /* ---------- Video detail ---------- */
  .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Signature: the sunset track. A video's journey from link to clips fills it like a Vice City horizon. */
  .track { margin-top: 22px; }
  .track .line { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track .fill { height: 100%; background: var(--sunset); background-size: var(--fullw, 100%) 100%;
                 border-radius: 99px; transition: width .5s ease; }
  .track .labels { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
  .track .labels span:nth-child(n+2) { text-align: center; } .track .labels span:last-child { text-align: right; }
  .track .labels .now { color: var(--text); font-weight: 600; }
  .status { margin-top: 12px; font-size: 13.5px; color: var(--text-2); }
  .status strong { color: var(--text); font-weight: 600; }
  @media (max-width: 600px) { .track .labels { grid-template-columns: repeat(3, 1fr); row-gap: 4px; }
    .track .labels span { text-align: left !important; } }

  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--sunset); border-radius: 99px; transition: width .4s; }
  .bar.indet > div { width: 30% !important; animation: slide 1.3s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }

  .notice { border-radius: 10px; padding: 12px 14px; margin-top: 18px; white-space: pre-wrap; font-size: 13.5px;
            background: var(--danger-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
  .notice strong { color: var(--danger); }

  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
  .clip { max-width: 260px; }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; border-radius: 14px;
                box-shadow: var(--shadow); }
  .clip .title { font-weight: 600; margin-top: 10px; line-height: 1.35; }
  .clip .why { font-size: 13px; color: var(--text-2); margin: 4px 0 8px; }
  .clip .row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-2); }
  .clip .save { color: var(--accent); font-weight: 600; text-decoration: none; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; }
  .clip .save:hover { background: var(--accent-soft); }
  .score { color: var(--text); font-weight: 600; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1000px) { .options { grid-template-columns: 1fr; } }
  .row-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .fc-wrap { position: relative; display: inline-block; max-width: 100%; user-select: none; cursor: crosshair; margin-top: 12px; }
  .fc-wrap img { display: block; max-width: 100%; border-radius: 10px; }
  .fc-box { position: absolute; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 4px; pointer-events: none; }
  .fc-text { max-width: 220px; }

  details.log { margin-top: 32px; }
  details.log summary { cursor: pointer; color: var(--text-2); font-weight: 600; font-size: 13px; }
  details.log pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
                    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height: 320px; overflow: auto; white-space: pre-wrap; }

  .empty { text-align: center; padding: 80px 20px; color: var(--text-2); }
  .empty h1 { color: var(--text); margin-bottom: 6px; }

  /* ---------- Setup + update banners ---------- */
  .banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-radius: 12px; padding: 12px 16px;
            margin-bottom: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13.5px; }
  .banner .grow { flex: 1; min-width: 220px; }
  .banner .ok-mark { color: var(--done); font-weight: 700; }
  .banner a { color: var(--accent); }
  .setup { margin-bottom: 24px; }
  .setup p { margin: 0 0 6px; color: var(--text-2); font-size: 13px; }
  .req { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .req:first-of-type { border-top: 0; }
  .req .icon { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center;
               font-size: 12px; font-weight: 700; margin-top: 1px; }
  .req .icon.ok { background: color-mix(in srgb, var(--done) 18%, transparent); color: var(--done); }
  .req .icon.no { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
  .req .name { font-weight: 600; }
  .req .opt { color: var(--text-2); font-weight: 400; }
  .req .sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .req .btn { margin-top: 8px; }
  .req a { color: var(--accent); font-weight: 600; display: inline-block; margin-top: 6px; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 8px 0 0; font-weight: 400; font-size: 13.5px; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .bar.indet > div { animation: none; width: 100% !important; opacity: .45; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Videos">
    <div class="brand">
      <img src="/favicon.png" alt="">
      <span>GTA VI Clipper</span>
      <button class="icon-btn" id="setupToggle" aria-pressed="false" aria-label="Setup" title="Setup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <button class="btn primary block" id="newBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New video
    </button>
    <div class="side-label" id="jobsLabel">Videos</div>
    <nav class="jobs" id="jobs"></nav>
  </aside>

  <main class="content" id="content">
    <div class="content-inner">
      <div id="updateBar" hidden></div>
      <div class="card setup" id="setup" hidden></div>

      <section class="new" id="newView" hidden>
        <h1>New video</h1>
        <p class="lede">Paste a link or choose a file. Clips are saved on this PC for you to review. Nothing is ever posted.</p>
        <form id="form">
          <div class="seg full" id="srcSeg" role="group" aria-label="Video source">
            <button type="button" data-v="url" class="on">Paste link</button>
            <button type="button" data-v="file">Upload file</button>
          </div>
          <div id="urlBox">
            <label for="url">YouTube or Twitch VOD link</label>
            <input id="url" name="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off">
          </div>
          <div id="fileBox" hidden>
            <label for="file">Video file</label>
            <input id="file" name="file" type="file" accept=".mp4,.mkv,.mov,.webm,.avi">
          </div>
          <label for="creator">Creator's name</label>
          <input id="creator" name="creator" required>
          <label for="permission">Permission you have to use it</label>
          <textarea id="permission" name="permission" required
            placeholder="e.g. Creator emailed OK on 2026-11-20 to make Shorts from this video"></textarea>
          <label id="layoutLabel">Layout</label>
          <div class="seg full" id="layoutSeg" role="group" aria-labelledby="layoutLabel">
            <button type="button" data-v="center" class="on">Center crop</button>
            <button type="button" data-v="facecam">Facecam on top</button>
          </div>
          <div class="hint">You can switch layout and mark the facecam after it downloads.</div>
          <label for="picker">Pick moments with</label>
          <select id="picker" class="select"></select>
          <div class="hint" id="pickerHint"></div>
          <button class="btn primary block" id="submit" type="submit">Make clips</button>
          <div class="msg" id="formMsg" role="status"></div>
        </form>
      </section>

      <section id="detail" hidden></section>
    </div>
  </main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const STEPS = [["download","Download"],["audio","Loud moments"],["transcribe","Transcript"],
               ["rank","Pick moments"],["plan","Cut points"],["render","Render"]];
const PICKER_NAMES = {auto: "Automatic", claude: "Claude", local: "Local AI", none: "No AI"};
let pickers = {claude: false, local: false, none: true, auto_uses: "none"};
let settings = {}, jobs = [], selected = null, detail = null, source = "url", layout = "center";
let view = null;            // "new" or null (= show the selected video)
let fcDraft = null, deleteArmed = false;

function pickerOptions(selectedValue) {
  const p = pickers;
  const opt = (v, label, ok) => `<option value="${v}" ${v === selectedValue ? "selected" : ""} ${ok ? "" : "disabled"}>${label}</option>`;
  return opt("auto", `Automatic (${PICKER_NAMES[p.auto_uses]})`, true)
    + opt("claude", "Claude — best picks" + (p.claude ? "" : " (not installed)"), p.claude)
    + opt("local", "Local AI — free, on this PC" + (p.local ? "" : " (not set up)"), p.local)
    + opt("none", "No AI — loudness and reactions", true);
}
const PICKER_HINTS = {
  auto: "Uses the best option set up on this PC.",
  claude: "Uses one short request from your Claude plan per video.",
  local: "Free and private. Takes a minute or two per video. Picks are less smart than Claude's.",
  none: "Instant and free. Picks the loudest, most reactive stretches; titles come from what's said.",
};
async function refreshPickers() {
  try { pickers = await api("/api/pickers"); } catch { return; }
  const sel = $("#picker");
  let want = sel.value;
  if (!want) { try { want = localStorage.getItem("picker"); } catch {} }
  want = want || pickers.default || "auto";
  if (want !== "auto" && !pickers[want]) want = "auto";
  sel.innerHTML = pickerOptions(want);
  $("#pickerHint").textContent = PICKER_HINTS[sel.value] || "";
  if (detail && detailKey() !== lastDetailKey) renderDetail();   // update the "Pick again" menu too
}
$("#picker").addEventListener("change", e => {
  try { localStorage.setItem("picker", e.target.value); } catch {}
  $("#pickerHint").textContent = PICKER_HINTS[e.target.value] || "";
});

async function api(path, opts = {}) {
  opts.headers = Object.assign({"x-clipper": "1"}, opts.headers || {});
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : r.statusText);
  return body;
}
const post = (path, body) => api(path, {method: "POST", headers: {"content-type": "application/json"},
                                         body: JSON.stringify(body || {})});

function segment(el, onPick) {
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    onPick(b.dataset.v);
  });
}
segment($("#srcSeg"), v => { source = v; $("#urlBox").hidden = v !== "url"; $("#fileBox").hidden = v !== "file"; });
segment($("#layoutSeg"), v => { layout = v; });

// ---- views ----
function showView() {
  const isNew = view === "new" || !selected;
  $("#newView").hidden = !isNew;
  $("#detail").hidden = isNew;
  $("#newBtn").setAttribute("aria-current", isNew ? "page" : "false");
}
$("#newBtn").addEventListener("click", () => {
  view = "new"; showView(); renderJobs();
  $("#content").scrollTop = 0;
  (source === "url" ? $("#url") : $("#file")).focus();
});

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("creator", $("#creator").value);
  fd.append("permission", $("#permission").value);
  fd.append("layout", layout);
  fd.append("picker", $("#picker").value || "auto");
  if (source === "url") fd.append("url", $("#url").value);
  else if ($("#file").files[0]) fd.append("file", $("#file").files[0]);
  $("#submit").disabled = true; $("#formMsg").className = "msg";
  $("#formMsg").textContent = source === "file" ? "Uploading…" : "";
  try {
    const job = await api("/api/jobs", {method: "POST", body: fd});
    $("#url").value = ""; $("#file").value = ""; $("#formMsg").textContent = "";
    selected = job.id; view = null; await refresh();
  } catch (err) { $("#formMsg").className = "msg err"; $("#formMsg").textContent = err.message; }
  $("#submit").disabled = !setupReady;
});

// ---- sidebar list ----
function statusText(j) {
  if (j.status === "done") return `${j.clip_count} ${j.clip_count === 1 ? "clip" : "clips"}`;
  if (j.status === "error") return "Needs attention";
  if (j.status === "queued") return "Waiting";
  const pct = j.progress != null ? ` · ${Math.round(j.progress * 100)}%` : "";
  return (j.stage_label || "Working") + pct;
}
function progressBar(j) {
  if (j.status !== "running") return "";
  const indet = j.progress == null, pct = Math.round((j.progress || 0) * 100);
  return `<div class="bar ${indet ? "indet" : ""}" role="progressbar" aria-label="${esc(j.stage_label || "Progress")}"
            ${indet ? "" : `aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"`}><div style="width:${pct}%"></div></div>`;
}
function renderJobs() {
  const isNew = view === "new" || !selected;
  $("#jobsLabel").hidden = !jobs.length;
  $("#jobs").innerHTML = jobs.length ? jobs.map(j => `
    <button class="job" data-id="${j.id}" aria-current="${!isNew && j.id === selected}">
      <div class="t">${esc(j.title || j.source.url || j.source.filename)}</div>
      <div class="s"><span class="dot ${j.status}"></span><span class="num">${esc(statusText(j))}</span></div>
      ${progressBar(j)}
    </button>`).join("") : `<div class="side-empty">Your videos will appear here.</div>`;
}
$("#jobs").addEventListener("click", e => {
  const el = e.target.closest(".job"); if (!el) return;
  selected = el.dataset.id; view = null; fcDraft = null; deleteArmed = false; showView(); refresh();
});

// ---- detail ----
function track(d) {
  const idx = STEPS.findIndex(s => s[0] === d.stage);
  let frac = d.status === "done" ? 1 : idx < 0 ? 0 : (idx + (d.progress || 0)) / STEPS.length;
  const labels = STEPS.map(([k, label], i) =>
    `<span class="${i === idx && d.status !== "done" ? "now" : ""}">${label}</span>`).join("");
  return `<div class="track"><div class="line" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"
            aria-valuenow="${Math.round(frac * 100)}"><div class="fill" style="width:${frac * 100}%;--fullw:${frac ? 100 / frac : 100}%"></div></div>
          <div class="labels">${labels}</div></div>`;
}

function renderDetail() {
  lastDetailKey = detailKey();
  const d = detail, el = $("#detail");
  if (!d) { el.innerHTML = ""; return; }
  const busy = d.status === "queued" || d.status === "running";
  const src = d.source.url ? `<a href="${esc(d.source.url)}" target="_blank" rel="noopener">${esc(d.source.url.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : esc(d.source.filename);
  const v = d.video;
  const hasPlan = d.plan && d.plan.length;
  let status = "";
  if (d.status === "running") status = `<div class="status"><strong>${esc(d.stage_label)}</strong>${d.progress_text ? " — " + esc(d.progress_text) : ""}</div>`;
  if (d.status === "queued") status = `<div class="status">Waiting for the video ahead of it to finish.</div>`;
  if (d.status === "done") status = `<div class="status"><strong>Done.</strong> ${d.clips.length} ${d.clips.length === 1 ? "clip" : "clips"} ready to review${d.picked_by ? ` · picked by ${esc(PICKER_NAMES[d.picked_by] || d.picked_by)}` : ""}.</div>`;

  el.innerHTML = `
    <div class="head">
      <div style="min-width:0;flex:1">
        <h1>${esc(d.title || "Video")}</h1>
        <div class="meta">${src}${v ? ` · <span class="num">${v.width}×${v.height} · ${mmss(v.duration)}</span>` : ""}</div>
        <div class="meta">${esc(d.creator)} · ${esc(d.permission)}</div>
      </div>
      <div class="actions">
        ${d.status === "error" ? `<button class="btn primary" id="retry">Retry</button>` : ""}
        ${d.clips.length ? `<button class="btn" id="openFolder">Open folder</button>` : ""}
        <button class="btn quiet danger ${deleteArmed ? "armed" : ""}" id="del" ${busy ? "disabled" : ""}>${deleteArmed ? "Delete video and clips" : "Delete"}</button>
      </div>
    </div>
    ${track(d)}
    ${status}
    ${d.status === "error" ? `<div class="notice" role="alert"><strong>Something went wrong.</strong> ${esc(d.error)}</div>` : ""}

    ${d.clips.length ? `<div class="section"><h2>Clips <span class="num" style="color:var(--text-2);font-weight:400">${d.clips.length}</span></h2>
      <div class="clips">${d.clips.map(c => `
      <article class="clip">
        <video controls preload="metadata" src="/api/jobs/${d.id}/clips/${encodeURIComponent(c.file)}?v=${encodeURIComponent(c.rendered_at)}" aria-label="${esc(c.title)}"></video>
        <div class="title">${esc(c.title)}</div>
        <div class="why">${esc(c.reason)}</div>
        <div class="row"><span class="num">${mmss(c.start)}–${mmss(c.end)} · ${(c.end - c.start).toFixed(0)}s · <span class="score">${c.score}</span>/10</span>
          <a class="save" href="/api/jobs/${d.id}/clips/${encodeURIComponent(c.file)}" download="${esc(c.file)}" data-save="${esc(c.file)}">${window.pywebview ? "Save as…" : "Download"}</a></div>
        ${c.cut_notes && c.cut_notes.length ? `<div class="hint">${esc(c.cut_notes.join("; "))}</div>` : ""}
      </article>`).join("")}</div></div>` : ""}

    ${v ? `<div class="section options">
      ${!busy && ["rank", "plan", "render", "done"].includes(d.stage) ? `<div class="card"><h2>Moments</h2>
        <div class="row-line">
          <select class="select inline" id="repickSel" aria-label="Pick moments again with">${pickerOptions(d.picked_by === "claude" ? (pickers.local ? "local" : "none") : (pickers.claude ? "claude" : "none"))}</select>
          <button class="btn" id="repick">Pick again</button>
        </div>
        <div class="hint">Reuses the download and transcript, so only picking and rendering run again.</div>
      </div>` : ""}
      <div class="card"><h2 id="reLayoutLabel">Layout</h2>
        <div class="row-line">
          <div class="seg" id="reLayout" role="group" aria-labelledby="reLayoutLabel">
            <button type="button" data-v="center" class="${(fcDraft?.layout || d.layout) === "center" ? "on" : ""}">Center crop</button>
            <button type="button" data-v="facecam" class="${(fcDraft?.layout || d.layout) === "facecam" ? "on" : ""}">Facecam on top</button>
          </div>
          <button class="btn" id="rerender" ${busy || !hasPlan ? "disabled" : ""}>Re-render clips</button>
        </div>
        ${!hasPlan ? `<div class="hint">Available once the moments are picked.</div>` : ""}
        <div id="fcArea" ${(fcDraft?.layout || d.layout) === "facecam" ? "" : "hidden"}>
          <div class="hint">Drag a box around the facecam.</div>
          <div class="fc-wrap" id="fcWrap"><img id="fcImg" src="/api/jobs/${d.id}/frame.jpg" alt="A frame from the video for marking the facecam" draggable="false"><div class="fc-box" id="fcBox"></div></div>
          <label for="fcText">Facecam area (x, y, width, height)</label>
          <input id="fcText" class="fc-text num" value="${esc((fcDraft?.facecam || d.facecam).join(", "))}">
        </div>
      </div>
    </div>` : ""}

    <details class="log"><summary>Activity log</summary><pre>${esc((d.log || []).map(l => `[${l.t}] ${l.msg}`).join("\n"))}</pre></details>`;
  wireDetail();
}

function wireDetail() {
  const d = detail;
  $("#retry")?.addEventListener("click", async () => { await api(`/api/jobs/${d.id}/retry`, {method: "POST"}); refresh(); });
  $("#openFolder")?.addEventListener("click", () => api(`/api/jobs/${d.id}/open-folder`, {method: "POST"}));
  // In the Windows app, "Save as…" opens a normal Windows save box instead of a browser download.
  document.querySelectorAll("[data-save]").forEach(a => a.addEventListener("click", async e => {
    if (!window.pywebview?.api?.save_clip) return;      // in a browser: normal download
    e.preventDefault();
    const saved = await window.pywebview.api.save_clip(d.id, a.dataset.save).catch(() => null);
    if (saved) { const old = a.textContent; a.textContent = "Saved ✓"; setTimeout(() => (a.textContent = old), 2500); }
  }));
  $("#repick")?.addEventListener("click", async () => {
    try { await post(`/api/jobs/${d.id}/repick`, {picker: $("#repickSel").value}); refresh(); }
    catch (e) { alertBox(e.message); }
  });
  $("#del")?.addEventListener("click", async () => {
    if (!deleteArmed) { deleteArmed = true; renderDetail(); setTimeout(() => { if (deleteArmed) { deleteArmed = false; renderDetail(); } }, 4000); return; }
    try { await api(`/api/jobs/${d.id}`, {method: "DELETE"}); selected = null; detail = null; } catch (e) { alertBox(e.message); }
    deleteArmed = false; refresh();
  });
  const layoutEl = $("#reLayout");
  if (layoutEl) segment(layoutEl, v => {
    fcDraft = {layout: v, facecam: fcDraft?.facecam || d.facecam};
    $("#fcArea").hidden = v !== "facecam"; drawBox();
  });
  $("#rerender")?.addEventListener("click", async () => {
    const lay = fcDraft?.layout || d.layout;
    try { await post(`/api/jobs/${d.id}/rerender`, {layout: lay, facecam: $("#fcText")?.value || ""}); fcDraft = null; refresh(); }
    catch (e) { alertBox(e.message); }
  });
  const img = $("#fcImg");
  if (!img) return;
  img.addEventListener("load", drawBox);
  if (img.complete) drawBox();
  $("#fcText").addEventListener("input", () => {
    const n = $("#fcText").value.split(",").map(s => parseInt(s.trim(), 10));
    if (n.length === 4 && n.every(x => x >= 0)) { fcDraft = {layout: fcDraft?.layout || d.layout, facecam: n}; drawBox(); }
  });
  let startPt = null;
  const toVideo = e => {
    const r = img.getBoundingClientRect();
    const sx = d.video.width / r.width, sy = d.video.height / r.height;
    return [Math.max(0, Math.min(d.video.width, (e.clientX - r.left) * sx)),
            Math.max(0, Math.min(d.video.height, (e.clientY - r.top) * sy))];
  };
  $("#fcWrap").addEventListener("pointerdown", e => { startPt = toVideo(e); e.currentTarget.setPointerCapture(e.pointerId); });
  $("#fcWrap").addEventListener("pointermove", e => {
    if (!startPt) return;
    const p = toVideo(e);
    const box = [Math.min(startPt[0], p[0]), Math.min(startPt[1], p[1]), Math.abs(p[0] - startPt[0]), Math.abs(p[1] - startPt[1])].map(Math.round);
    if (box[2] < 8 || box[3] < 8) return;
    fcDraft = {layout: "facecam", facecam: box};
    $("#fcText").value = box.join(", "); drawBox();
  });
  $("#fcWrap").addEventListener("pointerup", () => { startPt = null; });
}

function drawBox() {
  const img = $("#fcImg"), box = $("#fcBox");
  if (!img || !box || !detail?.video || !img.clientWidth) return;
  const [x, y, w, h] = fcDraft?.facecam || detail.facecam;
  const s = img.clientWidth / detail.video.width;
  Object.assign(box.style, {left: x * s + "px", top: y * s + "px", width: w * s + "px", height: h * s + "px"});
}
window.addEventListener("resize", drawBox);

function alertBox(msg) {
  const el = document.createElement("div"); el.className = "notice"; el.setAttribute("role", "alert"); el.textContent = msg;
  $(".content-inner").prepend(el); setTimeout(() => el.remove(), 6000);
}

// Only redraw the detail panel when something changed, so playing videos aren't interrupted.
let lastDetailKey = "";
const detailKey = () => JSON.stringify([pickers, detail?.id, detail?.status, detail?.stage, detail?.progress, detail?.picked_by,
  detail?.progress_text, detail?.clips?.map(c => c.rendered_at), detail?.log?.length, detail?.layout,
  detail?.facecam, detail?.video, deleteArmed]);

let firstLoad = true;
async function refresh() {
  try {
    jobs = await api("/api/jobs");
    if (selected && !jobs.some(j => j.id === selected)) selected = null;
    if (!selected && jobs.length && view !== "new") selected = jobs[0].id;
    if (firstLoad) { firstLoad = false; if (!jobs.length) view = "new"; }
    renderJobs();
    showView();
    detail = selected && view !== "new" ? await api(`/api/jobs/${selected}`).catch(() => null) : null;
    if (detailKey() !== lastDetailKey) { lastDetailKey = detailKey(); renderDetail(); }
  } catch (e) { /* engine restarting: try again on the next tick */ }
}

// ---- setup checklist (shown until everything required is installed) ----
let setupReady = true, setupKey = "", setupOpen = false, setupBusy = false;
$("#setupToggle").addEventListener("click", () => {
  setupOpen = !setupOpen; $("#setupToggle").setAttribute("aria-pressed", setupOpen); setupKey = ""; refreshSetup();
});
async function refreshSetup() {
  let s;
  try { s = await api("/api/setup"); } catch { return; }
  setupReady = s.ready;
  const busy = s.items.some(i => i.job && i.job.state === "running");
  if (setupBusy && !busy) refreshPickers();       // something just finished installing
  setupBusy = busy;
  const show = setupOpen || !s.ready || busy || s.items.some(i => !i.ok && i.action === "download" && i.required);
  const key = JSON.stringify([s, show, upd.auto, upd.current, upd.enabled]);
  $("#submit").disabled = !s.ready;
  $("#submit").title = s.ready ? "" : "Finish the setup first";
  if (key === setupKey) return;
  setupKey = key;
  const el = $("#setup");
  el.hidden = !show;
  if (!show) return;
  el.innerHTML = `<h2>Setup</h2>
    <p>${s.ready ? "Everything required is installed. Optional extras:" : "A few things are needed before your first video."}</p>
    ${s.items.filter(i => !(i.ok && !i.job)).concat(s.items.filter(i => i.ok && !i.job)).map(i => {
      const j = i.job, running = j && j.state === "running";
      let action = "";
      if (!i.ok && i.action === "download" && !running)
        action = `<button class="btn small" data-install="${i.id}">${j && j.state === "error" ? "Try again" : "Download"} · ${esc(i.size)}</button>`;
      if (!i.ok && i.action === "link")
        action = `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.link_text || "How to install")} →</a>`;
      return `<div class="req"><div class="icon ${i.ok ? "ok" : "no"}" aria-hidden="true">${i.ok ? "✓" : ""}</div><div style="flex:1">
        <div class="name">${esc(i.name)}${i.required ? "" : " <span class='opt'>· optional</span>"}${i.ok ? "<span class='opt'> · installed</span>" : ""}</div>
        ${i.help && !i.ok ? `<div class="sub">${esc(i.help)}</div>` : ""}
        ${running ? `<div class="sub num">${esc(j.text)}</div>${progressBar({status: "running", progress: j.progress, stage_label: i.name})}` : ""}
        ${j && j.state === "error" ? `<div class="sub" style="color:var(--danger)">${esc(j.text)}</div>` : ""}
        ${action}</div></div>`;
    }).join("")}
    ${upd.enabled ? `<div class="req"><div class="icon ok" aria-hidden="true">↻</div><div style="flex:1">
      <div class="name">Updates <span class="opt">· you have v${esc(upd.current)}</span></div>
      <label class="switch"><input type="checkbox" id="autoUpd" ${upd.auto ? "checked" : ""}>
        Install updates automatically when I close the app</label>
      <button class="btn small" id="checkUpd" style="margin-top:10px">Check for updates</button></div></div>` : ""}`;
  $("#autoUpd")?.addEventListener("change", async e => {
    await post("/api/update/auto", {on: e.target.checked}).catch(err => alertBox(err.message));
    refreshUpdate();
  });
  $("#checkUpd")?.addEventListener("click", async e => {
    e.target.disabled = true; e.target.textContent = "Checking…";
    const st = await post("/api/update/check").catch(() => null);
    e.target.disabled = false;
    e.target.textContent = st && !st.available ? "You're up to date ✓" : "Check for updates";
    refreshUpdate();
  });
  el.querySelectorAll("[data-install]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    await api(`/api/setup/${b.dataset.install}/install`, {method: "POST"}).catch(e => alertBox(e.message));
    refreshSetup();
  }));
}

// ---- update banner (installed app only) ----
let upd = {enabled: false}, updKey = "", updConfirmBusy = false;
async function refreshUpdate() {
  try { upd = await api("/api/update"); } catch { return; }
  const key = JSON.stringify([upd, updConfirmBusy]);
  if (key === updKey) return;
  updKey = key;
  const el = $("#updateBar");
  const ju = upd.just_updated;
  let html = "";
  if (ju) {
    html = `<div class="grow"><span class="ok-mark">✓</span> <strong>Updated to v${esc(ju.to)}.</strong>
      ${ju.offer_auto ? " Want future updates to install by themselves when you close the app?" : ""}</div>
      ${ju.offer_auto ? `<button class="btn primary small" data-u="auto-on">Turn on automatic updates</button>
                         <button class="btn quiet small" data-u="dismiss">No thanks</button>`
                      : `<button class="btn quiet small" data-u="dismiss">OK</button>`}`;
  } else if (upd.state === "downloading") {
    html = `<div class="grow num">${esc(upd.text)}${progressBar({status: "running", progress: upd.progress, stage_label: "Downloading update"})}</div>`;
  } else if (upd.state === "installing") {
    html = `<div class="grow">${esc(upd.text)}</div>`;
  } else if (upd.state === "ready" && upd.auto) {
    html = `<div class="grow">v${esc(upd.latest)} is downloaded and installs when you close the app.</div>
      <button class="btn small" data-u="install">Install now</button>`;
  } else if (upd.state === "error") {
    html = `<div class="grow" style="color:var(--danger)">${esc(upd.error)}</div><button class="btn small" data-u="install">Try again</button>`;
  } else if (upd.available && updConfirmBusy) {
    html = `<div class="grow">A video is still being processed. Updating now stops it; press Retry after the update to continue.</div>
      <button class="btn primary small" data-u="force">Update anyway</button><button class="btn quiet small" data-u="later">Later</button>`;
  } else if (upd.available) {
    html = `<div class="grow"><strong>Version ${esc(upd.latest)} is available.</strong> You have ${esc(upd.current)}.
      ${upd.notes_url ? ` <a href="${esc(upd.notes_url)}" target="_blank" rel="noopener">What's new</a>` : ""}</div>
      <button class="btn primary small" data-u="install">Update now</button>`;
  }
  el.hidden = !html;
  el.className = "banner";
  el.innerHTML = html;
  el.querySelectorAll("[data-u]").forEach(b => b.addEventListener("click", async () => {
    const what = b.dataset.u;
    b.disabled = true;
    try {
      if (what === "auto-on") await post("/api/update/auto", {on: true});
      if (what === "dismiss") await post("/api/update/dismiss");
      if (what === "later") updConfirmBusy = false;
      if (what === "install" || what === "force") {
        updConfirmBusy = false;
        await post("/api/update/install", {force: what === "force"});
      }
    } catch (e) {
      if (e.message === "busy") updConfirmBusy = true; else alertBox(e.message);
    }
    updKey = ""; refreshUpdate(); setupKey = ""; refreshSetup();
  }));
}
let lastUpdCheck = 0;
(async function updateLoop() {
  if (["downloading", "installing"].includes(upd.state) || Date.now() - lastUpdCheck > 30000) {
    lastUpdCheck = Date.now();
    await refreshUpdate();
  }
  setTimeout(updateLoop, 1000);
})();

// The Windows app injects window.pywebview slightly after the page loads: redraw once it's there.
window.addEventListener("pywebviewready", () => { lastDetailKey = ""; refresh(); });
api("/api/settings").then(s => { settings = s; }).catch(() => {});
refresh();
refreshPickers();
setInterval(refresh, 1500);
// Check the setup often while something installs or the panel is open, otherwise now and then.
let lastSetupCheck = 0;
(async function setupLoop() {
  if (setupBusy || setupOpen || Date.now() - lastSetupCheck > 15000) {
    lastSetupCheck = Date.now();
    await refreshSetup();
  }
  setTimeout(setupLoop, 2000);
})();
setInterval(refreshPickers, 30000);
</script>
</body>

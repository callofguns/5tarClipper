# Builds the Windows installer and attaches it to a GitHub release when a version tag is pushed.
#   1. Write packaging/release-notes/<tag>.md (copy TEMPLATE.md) in the pull request with the changes
#   2. After merging: git tag v0.5-Beta && git push origin v0.5-Beta
name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check this version has release notes
        shell: bash
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing $notes. Write the release notes (copy packaging/release-notes/TEMPLATE.md) and tag again."
            exit 1
          fi
          if grep -q "<the theme of this release" "$notes"; then
            echo "::error::$notes still contains the template's placeholder text."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries (without the large NVIDIA GPU files, which the app downloads itself)
        shell: bash
        run: |
          grep -v "^nvidia-" requirements.txt > requirements-build.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt pyinstaller pillow

      - name: Run tests
        run: python -m pytest -q

      - name: Stamp the version into the app (used by the update checker)
        shell: bash
        run: |
          echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > clipper/_version.py
          cat clipper/_version.py

      - name: Build the app with PyInstaller
        run: python -m PyInstaller packaging/gta6clipper.spec --noconfirm --clean

      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/5tarClipper-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/5tarClipper-Setup.exe.sha256", "$hash  5tarClipper-Setup.exe`n")
          # Same installer under the name used before the rename, so v0.4-Beta / v0.4.1-Beta can still update.
          Copy-Item dist/5tarClipper-Setup.exe dist/GTA6-Clipper-Setup.exe
          [IO.File]::WriteAllText("dist/GTA6-Clipper-Setup.exe.sha256", "$hash  GTA6-Clipper-Setup.exe`n")

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/5tarClipper-Setup.exe dist/5tarClipper-Setup.exe.sha256 \
            dist/GTA6-Clipper-Setup.exe dist/GTA6-Clipper-Setup.exe.sha256 \
            --title "5tarClipper ${{ github.ref_name }}" \
            --notes-file "packaging/release-notes/${{ github.ref_name }}.md" \
            --latest
          # Not marked "pre-release" even for -Beta tags: GitHub's /releases/latest/download/ link
          # (used by the project page's Download button) skips pre-releases.
